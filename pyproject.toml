[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subtitles"
version = "1.0.0"
description = "Python tool and library for adding hard and soft subtitles to videos using FFmpeg"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imageio-ffmpeg>=0.4.9",
    "pywhispercpp>=1.2.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
video-subtitles = "video_subtitles.cli:main"

[tool.setuptools.packages.find]
include = ["video_subtitles*"]
